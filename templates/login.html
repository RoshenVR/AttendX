{% extends "base.html" %}

{% block title %}Sign In - AttendX{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 75vh; padding: 20px 0;">
    <div class="ax-card" style="width: 100%; max-width: 440px; padding: 36px 32px; box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 28px;">
            <div class="brand-icon" style="margin: 0 auto 14px auto; width: 44px; height: 44px; font-size: 24px;">
                <i data-lucide="scan-qr-code" style="width: 24px; height: 24px;"></i>
            </div>
            <h1 class="brand-title" style="font-size: 26px;">Attend<span>X</span></h1>
            <p style="color: #64748b; font-size: 13.5px; margin-top: 4px;">Sign in to your institutional account</p>
        </div>

        <!-- Role Selector Tabs -->
        <div style="display: flex; background: #f1f5fa; padding: 4px; border-radius: var(--radius-pill); margin-bottom: 24px; border: 1px solid #e2eaf5;">
            <button type="button" onclick="setRole('student')" id="btn-student" style="flex: 1; padding: 8px 12px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 700; border: none; cursor: pointer; background: #ffffff; color: #2563eb; box-shadow: 0 2px 6px rgba(0,0,0,0.06); transition: all 0.2s ease;">Student</button>
            <button type="button" onclick="setRole('teacher')" id="btn-teacher" style="flex: 1; padding: 8px 12px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 600; border: none; cursor: pointer; background: transparent; color: #64748b; transition: all 0.2s ease;">Teacher</button>
            <button type="button" onclick="setRole('admin')" id="btn-admin" style="flex: 1; padding: 8px 12px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 600; border: none; cursor: pointer; background: transparent; color: #64748b; transition: all 0.2s ease;">Admin</button>
        </div>

        <form method="post" id="login-form">
            <input type="hidden" name="role" id="role-input" value="student">

            <div style="margin-bottom: 16px;">
                <label for="username" style="display: block; font-size: 12.5px; font-weight: 700; color: #475569; margin-bottom: 6px;">ID / Username</label>
                <div style="position: relative;">
                    <i data-lucide="user" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: #8c9ba5;"></i>
                    <input type="text" name="username" id="username" class="ax-input" style="padding-left: 40px;" placeholder="e.g. S10294 or teacher ID" required>
                </div>
            </div>

            <div style="margin-bottom: 24px;">
                <label for="password" style="display: block; font-size: 12.5px; font-weight: 700; color: #475569; margin-bottom: 6px;">Password</label>
                <div style="position: relative;">
                    <i data-lucide="lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: #8c9ba5;"></i>
                    <input type="password" name="password" id="password" class="ax-input" style="padding-left: 40px;" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn-scan-qr" style="width: 100%; border-radius: 12px; padding: 13px;">
                <span>Sign In</span>
                <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
            </button>
        </form>

        <p style="text-align: center; margin-top: 22px; margin-bottom: 0; font-size: 13px; color: #64748b;">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: #2563eb; font-weight: 700; text-decoration: none;">Register here</a>
        </p>
    </div>
</div>

<script>
    function setRole(role) {
        document.getElementById('role-input').value = role;

        const roles = ['student', 'teacher', 'admin'];
        roles.forEach(r => {
            const btn = document.getElementById('btn-' + r);
            if (r === role) {
                btn.style.background = '#ffffff';
                btn.style.color = '#2563eb';
                btn.style.fontWeight = '700';
                btn.style.boxShadow = '0 2px 6px rgba(0,0,0,0.06)';
            } else {
                btn.style.background = 'transparent';
                btn.style.color = '#64748b';
                btn.style.fontWeight = '600';
                btn.style.boxShadow = 'none';
            }
        });
    }
</script>
{% endblock %}
