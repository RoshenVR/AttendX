{% extends "base.html" %}

{% block title %}Scan Dynamic QR - AttendX{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; padding: 16px 0;">
    <div style="width: 100%; max-width: 520px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <div class="brand-icon" style="margin: 0 auto 12px auto; width: 44px; height: 44px; font-size: 24px;">
                <i data-lucide="scan-line" style="width: 22px; height: 22px;"></i>
            </div>
            <h1 class="brand-title" style="font-size: 24px;">Scan Dynamic QR Code</h1>
            <p style="color: #64748b; font-size: 13.5px; margin-top: 4px;">Point your camera at the instructor's live classroom screen</p>
        </div>

        <div class="ax-card" style="padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow-md);">
            <div style="position: relative; width: 100%; aspect-ratio: 1/1; background: #0f172a; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;" id="scanner-container">
                <video id="qr-video" style="width: 100%; height: 100%; object-fit: cover;"></video>
                <div id="scanner-placeholder" style="position: absolute; text-align: center; color: #94a3b8;">
                    <i data-lucide="camera" style="width: 44px; height: 44px; margin-bottom: 10px; opacity: 0.7;"></i>
                    <p style="margin: 0; font-size: 13px;">Camera preview will appear here</p>
                </div>
                <div class="scan-reticle"></div>
            </div>

            <div style="display: flex; gap: 10px;">
                <button id="start-scan-btn" class="btn-scan-qr" onclick="startScanner()" style="flex: 1; border-radius: 12px; padding: 12px;">
                    <i data-lucide="camera" style="width: 18px; height: 18px;"></i>
                    <span>Activate Camera</span>
                </button>
                <button id="stop-scan-btn" class="btn-filter-apply" onclick="stopScanner()" style="display: none; flex: 1; border-radius: 12px; padding: 12px; background: #fee2e2; color: #ef4444; border: 1px solid #fca5a5;">
                    <i data-lucide="video-off" style="width: 18px; height: 18px;"></i>
                    <span>Stop Camera</span>
                </button>
            </div>
        </div>

        <div class="ax-card" style="padding: 22px;">
            <h3 style="font-size: 14px; font-weight: 700; color: #102a67; margin: 0 0 12px 0;">Manual Token Fallback</h3>
            <form action="{{ url_for('student') }}" method="get" style="display: flex; gap: 10px;">
                <input type="text" name="token" class="ax-input" placeholder="Paste session token string..." required style="flex: 1;">
                <button type="submit" class="btn-filter-apply" style="padding: 0 20px;">Submit</button>
            </form>
        </div>
    </div>
</div>

<style>
    .scan-reticle {
        position: absolute;
        top: 20%;
        left: 20%;
        width: 60%;
        height: 60%;
        border: 2px dashed rgba(6, 182, 212, 0.8);
        border-radius: 14px;
        box-shadow: 0 0 0 2000px rgba(15, 23, 42, 0.45);
        pointer-events: none;
        animation: reticlePulse 2s infinite ease-in-out;
    }
    @keyframes reticlePulse {
        0%, 100% { border-color: rgba(6, 182, 212, 0.8); transform: scale(1); }
        50% { border-color: rgba(124, 58, 237, 0.9); transform: scale(1.02); }
    }
</style>

<script src="https://unpkg.com/@zxing/library@latest"></script>
<script>
    let codeReader;

    function startScanner() {
        codeReader = new ZXing.BrowserQRCodeReader();
        document.getElementById('scanner-placeholder').style.display = 'none';
        document.getElementById('start-scan-btn').style.display = 'none';
        document.getElementById('stop-scan-btn').style.display = 'inline-flex';

        codeReader.decodeFromInputVideoDevice(undefined, 'qr-video')
            .then((result) => {
                if (result && result.text) {
                    window.location.href = result.text;
                }
            })
            .catch((err) => {
                console.error(err);
                alert("Error starting camera: " + err);
                stopScanner();
            });
    }

    function stopScanner() {
        if (codeReader) {
            codeReader.reset();
        }
        document.getElementById('scanner-placeholder').style.display = 'block';
        document.getElementById('start-scan-btn').style.display = 'inline-flex';
        document.getElementById('stop-scan-btn').style.display = 'none';
    }
</script>
{% endblock %}
